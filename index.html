<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Boutique Surf Camp Weligama, Sri Lanka | Sample Surfer Camp</title>
    <meta name="description" content="Boutique surf camp in Weligama, Sri Lanka - 20 seconds from the beach. Brand-new ensuite rooms, rooftop infinity pool, sea-view dining and surf &amp; yoga packages from €390 a week." />
    <meta property="og:title" content="Boutique Surf Camp Weligama, Sri Lanka | Sample Surfer Camp" />
    <meta property="og:description" content="Boutique surf camp in Weligama, Sri Lanka - 20 seconds from the beach. Brand-new ensuite rooms, rooftop infinity pool, sea-view dining and surf &amp; yoga packages from €390 a week." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="/images/logo-mark.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#e9e2d4] text-[#3d372e] antialiased selection:bg-[#586857] selection:text-white">
    <!-- Loading screen: shown until fonts and the first photo are ready, then faded out by src/utils/effects.ts -->
    <div id="preloader" role="status" aria-label="Loading">
      <style>
        #preloader{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.4rem;background:#1e271e;color:#f4efe6;transition:opacity .7s ease,visibility .7s ease,clip-path .9s cubic-bezier(.76,0,.24,1);clip-path:inset(0 0 0 0)}
        #preloader.is-done{opacity:0;visibility:hidden;clip-path:inset(0 0 100% 0)}
        #preloader .pl-word{font-family:'Cormorant Garamond',Georgia,serif;font-weight:300;font-size:clamp(1.8rem,5vw,3.2rem);letter-spacing:.28em;text-indent:.28em;display:flex;overflow:hidden}
        #preloader .pl-word span{display:inline-block;transform:translateY(110%);animation:pl-rise .8s cubic-bezier(.2,.7,.2,1) forwards}
        #preloader .pl-sub{font-family:'Plus Jakarta Sans',system-ui,sans-serif;font-size:.7rem;letter-spacing:.5em;text-indent:.5em;text-transform:uppercase;opacity:0;animation:pl-fade .8s .6s ease forwards;color:#f4efe6b3}
        #preloader svg{width:9rem;height:1.6rem;overflow:visible}
        #preloader .pl-wave{fill:none;stroke:#d9a35b;stroke-width:2;stroke-linecap:round;stroke-dasharray:14 10;animation:pl-flow 1.2s linear infinite}
        @keyframes pl-rise{to{transform:none}}
        @keyframes pl-fade{to{opacity:1}}
        @keyframes pl-flow{to{stroke-dashoffset:-48}}
        @media (prefers-reduced-motion:reduce){#preloader *{animation:none!important;transform:none!important;opacity:1!important}}
      </style>
      <div class="pl-word" aria-hidden="true">
        <span style="animation-delay:.00s">S</span><span style="animation-delay:.04s">A</span><span style="animation-delay:.08s">M</span><span style="animation-delay:.12s">P</span><span style="animation-delay:.16s">L</span><span style="animation-delay:.20s">E</span><span>&nbsp;</span><span style="animation-delay:.28s">S</span><span style="animation-delay:.32s">U</span><span style="animation-delay:.36s">R</span><span style="animation-delay:.40s">F</span><span style="animation-delay:.44s">E</span><span style="animation-delay:.48s">R</span>
      </div>
      <svg viewBox="0 0 144 24" aria-hidden="true"><path class="pl-wave" d="M2 12c12-12 22-12 34 0s22 12 34 0 22-12 34 0 22 12 34 0"/></svg>
      <div class="pl-sub">Surf camp · Weligama</div>
    </div>
    <script>
      // Safety net: never leave visitors stuck on the loading screen if the app fails to start
      setTimeout(function () { var p = document.getElementById('preloader'); if (p) p.classList.add('is-done'); }, 8000);
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
